<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ใบปะหน้าพัสดุ</title>

    <!-- Google Font : Sarabun -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

</head>

<body>

<div class="control-panel">

    <h3>ระบบพิมพ์ใบปะหน้าพัสดุ</h3>


    <div class="seq-row">
        <label for="startSeqInput">
            ตั้งเลขที่ออเดอร์เริ่มต้น:
        </label>

        <input 
            type="number" 
            id="startSeqInput" 
            min="1" 
            value="1"
        >

        <button class="secondary" onclick="applyStartSeq()">
            ตั้งค่า
        </button>
    </div>



    <div class="mode-section bulk">

        <h4>
            📦 วางออเดอร์หลายรายการพร้อมกัน (แนะนำ)
        </h4>

        <textarea 
            id="bulkInput" 
            class="bulk-textarea"
            placeholder="วางข้อความยอดออเดอร์ทั้งก้อน (คั่นแต่ละออเดอร์ด้วย ---- หรือ ——)"
        ></textarea>

        <br>

        <button onclick="addBulkOrders()">
            🔍 แยกออเดอร์ทั้งหมด
        </button>


        <p class="hint">
            ระบบจะแยกแต่ละออเดอร์อัตโนมัติจากเส้นคั่น
            แล้วดึงชื่อ / ที่อยู่ / เบอร์โทร / โน้ตของลูกค้าออกมา
            ผลลัพธ์จะแสดงให้ตรวจสอบก่อนสร้างป้ายจริง
        </p>

    </div>



    <div 
        id="reviewPanel" 
        class="mode-section review"
        style="display:none;"
    ></div>




    <div class="mode-section">

        <h4>
            ✏️ เพิ่มทีละราย (สำหรับข้อมูลที่แยกยาก)
        </h4>


        <textarea 
            id="rawInput"
            placeholder="วางข้อมูลลูกค้าคนเดียว เช่น ชื่อ เบอร์ ที่อยู่"
        ></textarea>

        <br>


        <button onclick="addSingleOrder()">
            ➕ เพิ่มป้ายนี้
        </button>


    </div>




    <button onclick="window.print()">
        🖨️ พิมพ์เอกสารทั้งหมด
    </button>


    <button class="danger" onclick="resetAll()">
        🔄 ล้างป้ายทั้งหมด
    </button>


    <div id="status"></div>


</div>




<div id="pagesContainer"></div>




<script src="data.js"></script>

<script src="script.js"></script>


</body>

</html>
